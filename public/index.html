<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Morning Routine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Weekly Schedule</h1>

    <div class="days-grid" id="daysGrid">
      <!-- Generated by JS -->
    </div>

    <div class="file-section">
      <label for="musicFile">File:</label>
      <input type="text" id="musicFile" placeholder="e.g. /path/to/music.mp3">
      <button id="testPlayBtn" class="btn-play" title="Test Play">&#9654;</button>
      <button id="stopBtn" class="btn-stop" title="Stop" style="display:none;">&#9632;</button>
    </div>

    <div class="status-bar" id="statusBar"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
