<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Morning Routine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Weekly Schedule</h1>
    <div class="next-alarm" id="nextAlarm"></div>

    <div class="quick-actions">
      <button class="btn-quick" id="btnWeekdays">Weekdays</button>
      <button class="btn-quick" id="btnWeekends">Weekends</button>
      <button class="btn-quick" id="btnAll">All</button>
      <button class="btn-quick" id="btnNone">None</button>
    </div>

    <div class="days-grid" id="daysGrid">
      <!-- Generated by JS -->
    </div>

    <div class="file-section" id="fileSection">
      <button id="browseBtn" class="btn-browse" title="Browse">Browse</button>
      <span id="fileName" class="file-name">No file selected</span>
      <div class="playback-controls">
        <button id="playBtn" class="btn-play" title="Play">&#9654;</button>
        <button id="pauseBtn" class="btn-pause" title="Pause" style="display:none;">&#10074;&#10074;</button>
        <button id="resumeBtn" class="btn-play" title="Resume" style="display:none;">&#9654;</button>
        <button id="stopBtn" class="btn-stop" title="Stop" style="display:none;">&#9632;</button>
      </div>
    </div>

    <div class="status-bar" id="statusBar"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
